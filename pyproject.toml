[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smi2ass"
version = "1.5.1"
description = "A command-line SAMI to SSA/ASS subtitle converter"
requires-python = ">=3.11"
readme = "README.md"
license-files = ["LICENSE.txt"]
dependencies = ["beautifulsoup4", "charset-normalizer", "webcolors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/LinearAlpha/smi2ass"
Releases = "https://github.com/LinearAlpha/smi2ass/releases"

[project.scripts]
smi2ass = "smi2ass.__main__:main"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.10,<7"]

[project.gui-scripts]
smi2ass-gui = "smi2ass.gui_launcher:main"

[tool.setuptools]
include-package-data = false
packages = ["smi2ass"]
package-dir = { smi2ass = "src" }

[tool.setuptools.package-data]
smi2ass = ["setting/*.json", "setting/*.txt"]

