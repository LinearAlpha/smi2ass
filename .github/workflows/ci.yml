name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project with declared runtime dependencies
        run: python -m pip install .
      - name: Check runtime dependencies
        run: python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s src/test -v
      - name: Exercise installed CLI outside the checkout
        run: python scripts/smoke_test.py

  package:
    name: Build and verify wheel and sdist
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distributions.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  executable:
    name: Build and verify ${{ matrix.os }} executable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-build.txt
      - name: Build and verify distributions with build.sh
        if: runner.os == 'Linux'
        run: ./build.sh
      - name: Build and verify distributions with build.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish tested release
    needs: [test, package, executable]
    # A release commit on main is explicit publication intent. Normal pushes and
    # pull requests only build/test; manual publication is also available.
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: V')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check version and write checksums
        id: version
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tag = 'V' + version
          notes = pathlib.Path('RELEASE_NOTES.md').read_text()
          assert notes.startswith('# ' + tag + '\n'), 'Release notes and metadata disagree'
          files = sorted(pathlib.Path('release-assets').iterdir())
          expected = {'smi2ass_linux_x86-64.zip', 'smi2ass_linux_x86-64.7z',
                      'smi2ass_windows_x86-64.zip', 'smi2ass_windows_x86-64.7z',
                      f'smi2ass-{version}-py3-none-any.whl', f'smi2ass-{version}.tar.gz'}
          assert {p.name for p in files} == expected, files
          checksums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files)
          pathlib.Path('release-assets/SHA256SUMS.txt').write_text(checksums)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Create draft, upload assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft
          gh release upload "$RELEASE_TAG" release-assets/*
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')" = 7
          gh release edit "$RELEASE_TAG" --draft=false --latest
